[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hci"
version = "0.1.0"
authors = [
  { name="Robert Rood", email="robertrood@example.com" },
]
description = "A Python project for Human-Computer Interaction (HCI) research and development."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "isort>=5.10",
    "flake8>=4.0",
]
gui = [
    "PyQt6>=6.0.0",
    "opencv-python>=4.5.0",
]

[project.urls]
"Homepage" = "https://github.com/robertrood-se/HCI"
"Bug Tracker" = "https://github.com/robertrood-se/HCI/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hci*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"